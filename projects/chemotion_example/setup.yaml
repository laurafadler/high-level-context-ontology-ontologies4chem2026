format: setup-sheet-v1

# Setup sheet of the series chemotion_example, started with generator/workflow/new_project.py on 2026-10-05.
# It holds what only a person knows about the series; the generator asks everything else.
# Walk-through: docs/new_series_guide.md. Every field and its meaning: generator/interfaces/eln/README.md
# ("Setup sheet, version 1"); a complete example: projects/fdca_cl2_elabftw_7849/setup.yaml.
#
# Check the sheet at any time (it names what is still missing):
#     python generator/interfaces/eln/check_sheet.py projects/chemotion_example/setup.yaml
#
# Every answer needs a source (rule 2.10): 'source' at the top holds for everything that names none of
# its own; an entry can have its own 'source' (one text, or one per field). Codes: E/X from the ELN
# (structured field / free text, quoted), R rule, L looked up, C curated (who, when), D invented for a
# demonstration. Names of people, devices, substances and reactions are those of the libraries.
#
# The example (Laura Fadler, 05.10.2026): Congjian Lin's Chemotion collection export, a test instance with few values -
# it is to show how a Chemotion export becomes a crate, not to be complete. Experiment 1 is the reaction LCJ-R5,
# experiment 2 LCJ-R8: reductive catalytic fractionation (RCF) of spruce wood in an autoclave, the same procedure
# on two batches of wood. What the ELN does not say is an assumption of Claude Code (05.10.2026), marked as such
# and not yet confirmed, unless a source names Laura Fadler.

source: "C: setup sheet written by Claude Code for the Chemotion example (05.10.2026); assumptions marked, not yet confirmed"

series:
  short_name: chemotion_example
  planned_experiments:                         # experiments planned in total; empty = not known
  completed: true                              # true when no further experiment will follow
  eln_records:                                 # one core file per experiment, in the order of the experiments -
                                               # R5 and R8: the same RCF procedure on two batches of spruce wood (Laura Fadler, 05.10.2026)
    - core/Chemotion_LCJ-R5.json
    - core/Chemotion_LCJ-R8.json
  description: >-
    Reductive catalytic fractionation (RCF) of spruce wood (Picea abies): wood, a 5 wt% Pd/C catalyst and methanol in a
    stainless steel autoclave under 50 bar hydrogen at 151 °C for 3 h; the lignin goes into the methanol as a phenolic oil
    (mainly 4-propylguaiacol), the cellulose stays behind as a solid pulp. Two runs on two batches of wood - the reactions
    LCJ-R5 and LCJ-R8 of Congjian Lin's Chemotion collection 'Experiment', given as an example of a Chemotion export.
  source:
    short_name: "C: identifier chosen for the crate (Laura Fadler, 2026-10-05)"
    description: "X: ELN Chemotion LCJ-R5 and LCJ-R8, names, descriptions, conditions and the segment 'Reaction Details' (written by Claude Code, 05.10.2026)"
    completed: "C: the export is a snapshot of the two records; completed so that the hydrogenation stays the only open crate the tools fall back on, as in the eLabFTW case study (Laura Fadler, 05.10.2026)"

people:                                        # names as in libraries/people_library.jsonld
  creator: [Congjian Lin]                      # who planned the series
  experimenter: [Congjian Lin]                 # who performed the experiments
  source: "C: assumed - Congjian Lin exported the collection and created its analysis datasets; the export names no user (suggested by Claude Code, not yet confirmed)"

none:                                          # what explicitly does not exist - a category missing here is asked
  categories:
    - energy_fields
    - air_species
    - profiles
    - emptied
    - reference_sources
    - task_details
    - samples
  source: "C: nothing of the kind is in the export - no fields, no set profiles, no containers of the inventory (the hydrogen comes from a line), no document for the catalyst grade (suggested by Claude Code, not yet confirmed)"
  sources:
    task_details: "C: the export names no software and nothing a step aims at or acts on beyond what the sheet says (Claude Code, 05.10.2026)"
    samples: "C: no material of the sheet is a sample of another; the analysed samples of the export (LCJ-36, LCJ-159) are the materials themselves (Claude Code, 05.10.2026)"

devices:                                       # IDs of libraries/device_library.jsonld
  - stainless_autoclave_100mL_01               # 'stainless_autoclave' (segment 'Reaction Details')
  - filter_funnel_100mL_01                     # work-up: 'filtration'
  - rotary_evaporator_01                       # work-up: 'Evaporate MeOH'
  - NTU_CongjianLin_Lab_H2_supply              # gas supply 'h2_cylinder', taken as a line of the lab
  - spruce_wood_stock_SPRUCE-2025-03           # the wood of LCJ-R5 (inventory of LCJ-28)
  - spruce_wood_batch_BM-SPRUCE-NREL-01        # the wood of LCJ-R8
  - methanol_bottle_646377_01                  # the methanol (inventory of LCJ-44, LCJ-45)
  - bottle_pd_c_01                           # placeholder container (Laura Fadler, 08.10.2026)
  - flask_50mL_02                              # placeholder: the evaporation flask that holds the lignin oil (Laura Fadler, 09.10.2026)
devices_source: "C: the devices entered for the example by projects/chemotion_example/curation/archive/add_library_entries.py and the containers by archive/add_inventory.py (kinds decided by Laura Fadler, 05.10.2026)"

device_settings:
  - device: stainless_autoclave_100mL_01
    operation_mode: Batch
    source: "C: a closed autoclave run once - batch (suggested by Claude Code, not yet confirmed)"

materials:
  - name: Reaction_Mixture
    content_of: stainless_autoclave_100mL_01
    phases:
      - name: Liquid_Phase
        state: liquid
        species: [Methanol, Hydrogen, Lignin, 4-Propylguaiacol]
        dispersion: continuous
        solvents: [Methanol]
      - name: Wood_Phase
        state: solid
        species: [Cellulose, Lignin]
        dispersion: dispersed
        structure: semicrystalline
      - name: Catalyst_Phase
        state: solid
        species: [Palladium, Activated carbon]
        dispersion: dispersed
        structure: amorphous
      - name: Gas_Phase
        state: gaseous
        species: [Hydrogen]
        dispersion: continuous
    source:
      species: "X: ELN Chemotion LCJ-R5, LCJ-R8 - wood, 'Pd/C catalyst', 'MeOH solvent', '50 bar H2'; 4-propylguaiacol in the liquid ('Collected from MeOH liquid phase', sample LCJ-36), the cellulose in the solid residue (sample LCJ-37). The wood as cellulose and lignin, the lignin also dissolved in the methanol ('lignin-first' picture, variant C decided by Laura Fadler, 05.10.2026); hydrogen dissolved in the methanol and above it (assumed by Claude Code)"
      solvents: "X: ELN Chemotion LCJ-R5 'MeOH solvent'"
      dispersion: "C: wood particles and catalyst powder suspended in methanol, a gas space above (assumed by Claude Code)"
      structure: "C: wood semicrystalline (crystalline cellulose, amorphous lignin); the catalyst mostly amorphous carbon (assumed by Claude Code)"
  - name: Pulp
    content_of: filter_funnel_100mL_01
    phases:
      - name: Pulp_Phase
        state: solid
        species: [Cellulose, Palladium, Activated carbon]
        dispersion: continuous
        structure: semicrystalline
    source:
      species: "X: ELN Chemotion LCJ-R5 'Filter to separate solid cellulose pulp', LCJ-R8 'catalyst removed by filtration' - pulp and catalyst stay on the filter"
      dispersion: "C: a filter cake (assumed by Claude Code)"
      structure: "C: cellulose is semicrystalline (assumed by Claude Code)"
  - name: Lignin_Oil
    content_of: flask_50mL_02
    phases:
      - name: Lignin_Oil_Phase
        state: liquid
        species: [4-Propylguaiacol, Lignin, Methanol, Hydrogen]
        dispersion: continuous
        solvents: []
    source:
      content_of: "C: what stays in the evaporation flask once the methanol is gone - a placeholder flask, the records name none (decided by Laura Fadler, 09.10.2026; suggested by Claude Code)"
      species: "X: ELN Chemotion LCJ-R5 'Evaporate MeOH to recover liquid phenolic fraction'; product samples LCJ-36 ('Main lignin-derived liquid product') and LCJ-162 (4-Propylguaiacol). With it what the filtrate brings (dissolved lignin, rests of methanol and hydrogen) - amounts not known (Claude Code, 09.10.2026)"
      solvents: "C: none - what is left once the methanol is evaporated (Claude Code, 09.10.2026)"
      dispersion: "C: assumed by Claude Code"

uncontained_streams:
  - name: Wood_Stock_Charge
    from: spruce_wood_stock_SPRUCE-2025-03_opening
    to: stainless_autoclave_100mL_01
    phases:
      - {name: Wood_Stock_Charge_Phase, state: solid, species: [Cellulose, Lignin], dispersion: continuous, structure: semicrystalline}
    to_phase: Wood_Phase
    source:
      to_phase: "C: the wood goes into the wood phase (Claude Code, 05.10.2026)"
      from: "X: ELN Chemotion LCJ-R5, sample LCJ-35: '5g aliquot from SPRUCE-2025-03 stock' - the stock of the inventory (sample LCJ-28); the link stands only in the free text (Laura Fadler, 05.10.2026: insert it)"
      state: "E: ELN Chemotion, starting material samples 'Spruce Wood — RCF Feed' (LCJ-35-1) and 'Spruce Wood Pellets — Raw Biomass' (LCJ-159)"
      species: "C: spruce wood as cellulose and lignin - hemicellulose and extractives left out ('lignin-first' picture, variant C decided by Laura Fadler, 05.10.2026)"
      dispersion: "C: assumed by Claude Code"
      structure: "C: assumed by Claude Code"
  - name: Wood_Batch_Charge
    from: spruce_wood_batch_BM-SPRUCE-NREL-01_opening
    to: stainless_autoclave_100mL_01
    phases:
      - {name: Wood_Batch_Charge_Phase, state: solid, species: [Cellulose, Lignin], dispersion: continuous, structure: semicrystalline}
    to_phase: Wood_Phase
    source:
      to_phase: "C: the wood goes into the wood phase (Claude Code, 05.10.2026)"
      from: "X: ELN Chemotion LCJ-R8, 'RCF of the NREL-characterized spruce wood pellet batch (BM-SPRUCE-NREL-01)'"
      state: "E: ELN Chemotion, starting material samples 'Spruce Wood — RCF Feed' (LCJ-35-1) and 'Spruce Wood Pellets — Raw Biomass' (LCJ-159)"
      species: "C: spruce wood as cellulose and lignin - hemicellulose and extractives left out ('lignin-first' picture, variant C decided by Laura Fadler, 05.10.2026)"
      dispersion: "C: assumed by Claude Code"
      structure: "C: assumed by Claude Code"
  - name: Catalyst_Charge
    from: bottle_pd_c_01_opening
    to: stainless_autoclave_100mL_01
    phases:
      - {name: Catalyst_Charge_Phase, state: solid, species: [Palladium, Activated carbon], dispersion: continuous, structure: amorphous}
    to_phase: Catalyst_Phase
    source:
      from: "C: an assumed container of the libraries (a placeholder, allowed by Laura Fadler on 08.10.2026; Claude Code)"
      to_phase: "C: the catalyst goes into the catalyst phase (Claude Code, 05.10.2026)"
      state: "X: ELN Chemotion LCJ-R5, LCJ-R8 '5 wt% Pd/C catalyst (100 mg)'"
      dispersion: "C: assumed by Claude Code"
      structure: "C: assumed by Claude Code"
  - name: Methanol_Charge
    from: methanol_bottle_646377_01_opening
    to: stainless_autoclave_100mL_01
    phases:
      - {name: Methanol_Charge_Phase, state: liquid, species: [Methanol], dispersion: continuous}
    to_phase: Liquid_Phase
    source:
      to_phase: "C: the methanol goes into the liquid (Claude Code, 05.10.2026)"
      from: "C: the methanol bottle of the collection's inventory (Sigma-Aldrich 646377-1L, LCJ-44, LCJ-45) - taken as the source of both runs (Laura Fadler, 05.10.2026)"
      state: "X: ELN Chemotion LCJ-R5, LCJ-R8 'MeOH solvent (20 mL)'"
      dispersion: "C: assumed by Claude Code"
  - name: Hydrogen_Charge
    from: NTU_CongjianLin_Lab_H2_supply_outlet
    to: stainless_autoclave_100mL_01
    phases:
      - {name: Hydrogen_Charge_Phase, state: gaseous, species: [Hydrogen], dispersion: continuous}
    to_phase: Gas_Phase
    source:
      to_phase: "C: the hydrogen goes into the gas space (Claude Code, 05.10.2026)"
      from: "C: the hydrogen line of the lab (decided by Laura Fadler, 05.10.2026)"
      state: "X: ELN Chemotion LCJ-R5, LCJ-R8 '50 bar H2'"
      dispersion: "C: assumed by Claude Code"
  - name: Hydrogen_Vent
    from: stainless_autoclave_100mL_01
    to: outside
    phases:
      - {name: Hydrogen_Vent_Phase, state: gaseous, species: [Hydrogen], dispersion: continuous}
    from_phase: Gas_Phase
    source:
      from_phase: "C: the vented hydrogen comes from the gas space (Claude Code, 05.10.2026)"
      from: "E: ELN Chemotion LCJ-R5 'Gas / Pressure Vented Before Opening Reactor' ticked; LCJ-R8 'H2 vented'"
      state: "C: assumed by Claude Code"
      dispersion: "C: assumed by Claude Code"
  # The work-up as two streams out of the autoclave - a minimal way for pulp and lignin oil, so that each has an
  # origin (decided by Laura Fadler, 09.10.2026; suggested by Claude Code): the solids onto the filter, the product
  # with the filtrate into the evaporation flask. The filtrate passing the filter and the methanol leaving the
  # flask are left out.
  - name: Pulp_Discharge
    from: stainless_autoclave_100mL_01
    to: filter_funnel_100mL_01
    phases:
      - {name: Pulp_Discharge_Wood_Phase, state: solid, species: [Cellulose], dispersion: continuous, structure: semicrystalline}
      - {name: Pulp_Discharge_Catalyst_Phase, state: solid, species: [Palladium, Activated carbon], dispersion: continuous, structure: amorphous}
    crossing_phases: [Pulp_Discharge_Wood_Phase, Pulp_Discharge_Catalyst_Phase]
    from_phase: {Pulp_Discharge_Wood_Phase: Wood_Phase, Pulp_Discharge_Catalyst_Phase: Catalyst_Phase}
    to_phase: {Pulp_Discharge_Wood_Phase: Pulp_Phase, Pulp_Discharge_Catalyst_Phase: Pulp_Phase}
    source:
      from: "X: ELN Chemotion LCJ-R5 'Filter to separate solid cellulose pulp', LCJ-R8 'catalyst removed by filtration' - the solids of the autoclave onto the filter (assumed by Claude Code, 09.10.2026)"
      species: "C: the cellulose that stayed in the wood and the catalyst - the species of the pulp (assumed by Claude Code, 09.10.2026)"
      from_phase: "C: the cellulose from the wood, the catalyst from its phase (assumed by Claude Code, 09.10.2026)"
      to_phase: "C: both end up in the pulp on the filter (assumed by Claude Code, 09.10.2026)"
      state: "C: assumed by Claude Code"
      dispersion: "C: assumed by Claude Code"
      structure: "C: as the phases they come from (assumed by Claude Code)"
  - name: Filtrate_Transfer
    from: stainless_autoclave_100mL_01
    to: flask_50mL_02
    phases:
      - {name: Filtrate_Transfer_Phase, state: liquid, species: [4-Propylguaiacol, Lignin, Methanol, Hydrogen], dispersion: continuous, solvents: [Methanol]}
    from_phase: Liquid_Phase
    to_phase: Lignin_Oil_Phase
    source:
      from: "X: ELN Chemotion LCJ-R5 'Evaporate MeOH to recover liquid phenolic fraction', LCJ-R8 'solvent evaporated' - the liquid of the autoclave into the evaporation flask; the filter in between and the methanol are left out (assumed by Claude Code, 09.10.2026)"
      species: "C: the liquid of the autoclave as it is - the product, dissolved lignin, methanol and hydrogen (Claude Code, 09.10.2026)"
      solvents: "X: ELN Chemotion LCJ-R5 'MeOH solvent'"
      from_phase: "C: the product is in the methanol ('Collected from MeOH liquid phase', LCJ-R5 sample LCJ-36)"
      to_phase: "C: it stays in the flask as the lignin oil (assumed by Claude Code, 09.10.2026)"
      state: "C: assumed by Claude Code"
      dispersion: "C: assumed by Claude Code"

occupation_states: []                          # no occupation state at any interface (moved here from 'open', 08.10.2026)

reactions:
  - name: Reductive catalytic fractionation of spruce wood
    at_interface: [Catalyst_Phase, Liquid_Phase]
    transfers:                                 # per participant at the interface (the generator asks it otherwise)
      - participant: Lignin
        type: Adsorption
        phase: Liquid_Phase
        source:
          type: "C: the dissolved lignin is taken up at the catalyst surface from the methanol, as the adiponitrile of the hydrogenation ('lignin-first', Laura Fadler, 05.10.2026)"
      - participant: Hydrogen
        phase: Liquid_Phase
        type: Adsorption
        source:
          phase: "C: the hydrogen comes from the methanol it is dissolved in, as in the hydrogenation (Claude Code)"
          type: "C: the dissolved hydrogen is taken up at the catalyst surface, as in the hydrogenation (Claude Code)"
      - participant: Propylguaiacol
        phase: Liquid_Phase
        type: Desorption
        source:
          phase: "C: the product goes into the methanol ('Collected from MeOH liquid phase', LCJ-R5 sample LCJ-36)"
          type: "C: the product leaves the catalyst surface into the methanol, as the hexamethylenediamine of the hydrogenation (Claude Code)"
    source:
      name: "X: ELN Chemotion LCJ-R5, LCJ-R8 'Reductive Catalytic Fractionation (RCF)', reaction class 'biomass_fractionation'; a lumped reaction (decided by Laura Fadler, 05.10.2026)"
      at_interface: "C: the dissolved lignin is broken down at the surface of the catalyst, as the hydrogenation at its platinum ('lignin-first' picture, variant C decided by Laura Fadler, 05.10.2026)"

tasks:
  - name: Weighing the spruce wood
    type: measurement
    part_of: Establishing the values
    equipment: []
    determines: [Wood_Stock_Charge/Wood_Stock_Charge_Phase/mass]
    performers: [Congjian Lin]
    description: "The wood of LCJ-R5: '5g aliquot from SPRUCE-2025-03 stock (Sample A). Weighed for RCF autoclave experiment.' (sample LCJ-35)."
    source:
      name: "C: named after what the task does (Claude Code)"
      part_of: "C: a task that establishes values hangs under 'Establishing the values', as in the eLabFTW case study"
      equipment: "C: not known which balance (assumed by Claude Code)"
      determines: "X: ELN Chemotion LCJ-R5, sample description 'Weighed for RCF autoclave experiment'"
      performers: "C: assumed - Congjian Lin performed the experiments (suggested by Claude Code, not yet confirmed)"
      description: "X: ELN Chemotion, sample LCJ-35"
  - name: Measuring out catalyst and methanol
    type: measurement
    part_of: Establishing the values
    equipment: []
    determines: [Catalyst_Charge/Catalyst_Charge_Phase/mass, Methanol_Charge/Methanol_Charge_Phase/volume]
    performers: [Congjian Lin]
    description: "The catalyst and methanol of the run - setup notes '5 wt% Pd/C catalyst (100 mg). MeOH solvent (20 mL).'"
    source:
      name: "C: named after what the task does (Claude Code)"
      part_of: "C: a task that establishes values hangs under 'Establishing the values', as in the eLabFTW case study"
      equipment: "C: not known which balance or cylinder (assumed by Claude Code)"
      determines: "C: what was put in, read as weighed or measured out (assumed by Claude Code, not yet confirmed)"
      performers: "C: assumed - Congjian Lin performed the experiments (suggested by Claude Code, not yet confirmed)"
      description: "X: ELN Chemotion LCJ-R5, LCJ-R8, segment 'Reaction Details', setup notes"
  - name: Noting the wood batch
    type: observation
    part_of: Preparation
    equipment: []
    performers: [Congjian Lin]
    observes: [Wood_Stock_Charge, Wood_Batch_Charge]
    description: "Which wood went into the autoclave: in LCJ-R5 an aliquot of the stock SPRUCE-2025-03 ('5g aliquot from SPRUCE-2025-03 stock'), in LCJ-R8 the NREL-characterized batch BM-SPRUCE-NREL-01."
    source:
      name: "C: named after what the task does (Claude Code)"
      type: "C: who charges sees which batch goes in - an observation (Claude Code)"
      part_of: "C: while charging (Claude Code)"
      equipment: "C: by eye (Claude Code)"
      performers: "C: assumed - Congjian Lin performed the experiments (suggested by Claude Code, not yet confirmed)"
      observes: "X: ELN Chemotion LCJ-R5 sample LCJ-35, LCJ-R8 description"
      description: "X: ELN Chemotion LCJ-R5, sample LCJ-35; LCJ-R8, description and setup notes"
  - name: Looking up the catalyst grade         # the task of the literature value 5 wt% Pd (07.10.2026)
    performers: [Congjian Lin]
    description: "The palladium content of the catalyst as the supplier states it ('5 wt% Pd/C catalyst')."
    source:
      name: "C: named after what the task does - a literature lookup of its own, not the planning (decided by Laura Fadler, 07.10.2026; name suggested by Claude Code)"
      performers: "C: assumed - Congjian Lin, the creator of the series, as the run before named the planning's performer for it (suggested by Claude Code, not yet confirmed)"
      description: "X: ELN Chemotion LCJ-R5, LCJ-R8, '5 wt% Pd/C catalyst' (conditions, setup notes)"
  - name: Calculating the palladium of the catalyst
    type: calculation
    part_of: Establishing the values
    inputs: [Mass Catalyst_Charge_Phase]       # the mass of the whole phase - a species would be named after it
    performers: [Laura Fadler]
    description: "The palladium of the catalyst: 5 wt% of the 100 mg catalyst charged ('5 wt% Pd/C catalyst (100 mg)') = 5 mg."
    source:
      name: "C: named after what the task does (Claude Code)"
      inputs: "C: the catalyst mass of the experiment; the grade 5 wt% is in the description (Claude Code)"
      performers: "C: the person who builds the crate makes its calculations (Laura Fadler, 01.10.2026)"
      description: "X: ELN Chemotion LCJ-R5, LCJ-R8, setup notes '5 wt% Pd/C catalyst (100 mg)'"
  - name: Charging the autoclave
    type: transfer
    part_of: Preparation
    equipment: [stainless_autoclave_100mL_01, bottle_pd_c_01, methanol_bottle_646377_01]
    functions: [Charging]
    performers: [Congjian Lin]
    aims_at:
      - Palladium from Catalyst_Charge_Phase to Catalyst_Phase
      - Activated carbon from Catalyst_Charge_Phase to Catalyst_Phase
      - Methanol from Methanol_Charge_Phase to Liquid_Phase
    description: "Catalyst and methanol into the autoclave - LCJ-R5: 'Catalyst: 5 wt% Pd/C (100 mg). Solvent: MeOH (20 mL).' The wood goes in with a task of its own per run."
    source:
      equipment: "C: the autoclave, the assumed container of the catalyst (placeholder, Laura Fadler, 08.10.2026) and the methanol bottle it adds from - taking something out is a use of the container (rule 3.10; Laura Fadler, 09.10.2026)"
      name: "C: named after what the task does (Claude Code)"
      aims_at: "X: ELN Chemotion LCJ-R5 description, LCJ-R5/LCJ-R8 setup notes"
      functions: "C: Charging, as the adding tasks of the other examples"
      performers: "C: assumed - Congjian Lin performed the experiments (suggested by Claude Code, not yet confirmed)"
      description: "X: ELN Chemotion LCJ-R5, description"
  - name: Charging the wood stock
    type: transfer
    part_of: Preparation
    experiments: [1]
    equipment: [stainless_autoclave_100mL_01, spruce_wood_stock_SPRUCE-2025-03]
    functions: [Charging]
    performers: [Congjian Lin]
    aims_at:
      - Cellulose from Wood_Stock_Charge_Phase to Wood_Phase
      - Lignin from Wood_Stock_Charge_Phase to Wood_Phase
    description: "The wood of LCJ-R5 into the autoclave - '5g aliquot from SPRUCE-2025-03 stock', 'Feed: 5g air-dry biomass'."
    source:
      experiments: "X: ELN Chemotion LCJ-R5, sample LCJ-35 - only this run used the stock; a task of its own so that the container is used only here (Laura Fadler, 09.10.2026)"
      equipment: "C: the autoclave and the container the wood is taken from (rule 3.10; Laura Fadler, 09.10.2026)"
      name: "C: named after what the task does (Claude Code)"
      aims_at: "X: ELN Chemotion LCJ-R5, sample LCJ-35"
      functions: "C: Charging, as the adding tasks of the other examples"
      performers: "C: assumed - Congjian Lin performed the experiments (suggested by Claude Code, not yet confirmed)"
      description: "X: ELN Chemotion LCJ-R5, description and sample LCJ-35"
  - name: Charging the wood batch
    type: transfer
    part_of: Preparation
    experiments: [2]
    equipment: [stainless_autoclave_100mL_01, spruce_wood_batch_BM-SPRUCE-NREL-01]
    functions: [Charging]
    performers: [Congjian Lin]
    aims_at:
      - Cellulose from Wood_Batch_Charge_Phase to Wood_Phase
      - Lignin from Wood_Batch_Charge_Phase to Wood_Phase
    description: "The wood of LCJ-R8 into the autoclave - 'the NREL-characterized spruce wood pellet batch (BM-SPRUCE-NREL-01)'."
    source:
      experiments: "X: ELN Chemotion LCJ-R8 - only this run used the NREL batch; a task of its own so that the container is used only here (Laura Fadler, 09.10.2026)"
      equipment: "C: the autoclave and the container the wood is taken from (rule 3.10; Laura Fadler, 09.10.2026)"
      name: "C: named after what the task does (Claude Code)"
      aims_at: "X: ELN Chemotion LCJ-R8, description"
      functions: "C: Charging, as the adding tasks of the other examples"
      performers: "C: assumed - Congjian Lin performed the experiments (suggested by Claude Code, not yet confirmed)"
      description: "X: ELN Chemotion LCJ-R8, description and setup notes"
  - name: Pressurising with hydrogen
    type: transfer
    part_of: Preparation
    equipment: [stainless_autoclave_100mL_01, NTU_CongjianLin_Lab_H2_supply]
    functions: [Charging]
    performers: [Congjian Lin]
    aims_at: [Hydrogen from Hydrogen_Charge_Phase to Gas_Phase]
    description: "The closed autoclave is filled with hydrogen to 50 bar ('50 bar H2', gas supply 'h2_cylinder')."
