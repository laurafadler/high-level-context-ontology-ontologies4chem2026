type: labware             # (required) type of the entries - do not change
entered_by: Laura Fadler  # (required) who writes these entries into the library: person:<ID> or the name of a person of the People Library
source: A placeholder for the flask the methanol is evaporated from in the work-up of LCJ-R5 and LCJ-R8 ('Evaporate MeOH to recover liquid phenolic fraction', 'solvent evaporated') - the records name no flask; it holds the lignin oil afterwards (decided by Laura Fadler on 09.10.2026, a minimal way of the lignin oil; suggested by Claude Code).

